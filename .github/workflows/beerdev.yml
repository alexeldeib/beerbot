name: beerdev digest

# Mondays, beerdev posts one line of history in the chat: what shipped, what was declined or
# vetoed, and how much waits on a human. Quiet weeks post nothing. Asks and answers happen in the
# app (src/beerbot/beerdev.py); builds in beerdev-build.yml.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 9am Eastern
  workflow_dispatch:

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # It holds credentials: never restore a cache agent code saved.

      - run: uv run --frozen python scripts/beerdev.py digest
        env:
          GH_TOKEN: ${{ github.token }}
          BEERDEV_BOT_ID: ${{ secrets.BEERDEV_BOT_ID }}
