name: Roll back production

# ops starts this when production breaks within an hour of a deploy, the one automatic mitigation.
# You can also run it by hand. It redeploys the newest release with a different image than the
# current one, with that commit's fly.toml, blue-green, and verifies it. If production already went
# back to an image it ran before (CI or this workflow rolled it back), the release before it is the
# broken one, so it refuses: name the release to restore with `version` instead.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be deployed
        type: boolean
        default: false
      version:
        description: Fly release to restore (`flyctl releases --app beerbot-groupme --image`)
        required: false

permissions:
  contents: read

# Never alongside a CI deploy: one change to production at a time.
concurrency:
  group: beerbot-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # Releases that only changed secrets share an image, so they count once. CI labels each
      # image with its commit, whose fly.toml goes with it, as CI's own rollback does.
      - name: Find the release to restore
        id: target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          releases="$(flyctl releases --app beerbot-groupme --image --json \
            | jq '[.[] | select(.Status == "complete")]')"
          if [ -n "$VERSION" ]; then
            target="$(jq -c --arg v "${VERSION#v}" \
              'first(.[] | select(.Version | tostring == $v)) // empty' <<< "$releases")"
            if [ -z "$target" ]; then
              echo "::error::v${VERSION#v} is not a complete release"
              exit 1
            fi
          else
            images="$(jq -c 'reduce .[] as $r ([];
              if .[-1].ImageRef == $r.ImageRef then . else . + [$r] end)' <<< "$releases")"
            if jq -e '.[0].ImageRef as $now | any(.[2:][]; .ImageRef == $now)' <<< "$images" > /dev/null; then
              echo "::error::Production already rolled back to an image it ran before, so the release before it is the broken one. Name the release to restore: -f version=<n>"
              exit 1
            fi
            target="$(jq -c '.[1] // empty' <<< "$images")"
          fi
          echo "Running: $(jq -r '.[0].ImageRef' <<< "$releases")"
          echo "Restoring: $(jq -r '"\(.ImageRef) v\(.Version) \(.CreatedAt)"' <<< "$target")"
          image="$(jq -r '.ImageRef // empty' <<< "$target")"
          if [[ "$image" != registry.fly.io/* ]]; then
            echo "::error::No earlier release to roll back to"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          sha="${image%%@*}" && sha="${sha##*:}"
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --depth 1 origin "$sha"; then
            git show "${sha}:fly.toml" > fly.toml
            echo "With fly.toml from $sha"
          else
            echo "::warning::The image has no commit label (older than CI's labels), so main's fly.toml is used"
          fi

      - name: Deploy it blue-green
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE: ${{ steps.target.outputs.image }}
        run: flyctl deploy --app beerbot-groupme --image "$IMAGE" --strategy bluegreen --wait-timeout 10m

      - name: Verify production
        if: ${{ !inputs.dry_run }}
        run: |
          for check in health ready ready/db; do
            curl --fail --silent --show-error --max-time 15 \
              --retry 10 --retry-all-errors --retry-delay 3 \
              "https://beerbot-groupme.fly.dev/$check" > /dev/null
          done
          curl --fail --silent --max-time 15 https://beerbot-groupme.fly.dev/version | jq -r '"Now serving \(.git_sha)"'
