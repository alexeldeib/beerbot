name: beerdev lead

# Weekly planning: Claude Code reviews the code, incidents, and backlog with read-only access and
# proposes up to three improvements. beerdev builds the safe ones without review; anything that
# needs a person (dependencies, infrastructure, costs, product calls) waits in the inbox labeled
# `proposal` until the owner approves it.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, an hour before the digest
  workflow_dispatch:

permissions: {}

concurrency:
  group: beerdev-lead
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only token, used only by the trusted gather step; the agent's only output is its answer.
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          persist-credentials: false

      # Trusted inputs only: issues by this repository's own workflows or its owner (anyone can
      # open an issue on a public repository), plus recent CI runs. The agent gets no gh access.
      - name: Gather issues and runs
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p /tmp/lead
          gh issue list -R "$GITHUB_REPOSITORY" --state all --limit 60 \
            --json number,title,state,stateReason,labels,author,body,closedAt \
            | jq --arg owner "$OWNER" '[.[] | select(.author.login == $owner or .author.login == "app/github-actions" or .author.login == "github-actions[bot]")]' \
            > /tmp/lead/issues.json
          gh run list -R "$GITHUB_REPOSITORY" --limit 30 \
            --json workflowName,event,status,conclusion,headSha,createdAt > /tmp/lead/runs.json

      # Read-only tools, and the plan comes back as the final answer: the agent can neither
      # write files nor run code while it holds the Claude token.
      - name: Plan with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          npx -y @anthropic-ai/claude-code@2.1.319 -p "$(cat .github/beerdev-lead-prompt.md)"
          --add-dir /tmp/lead --output-format json
          --allowedTools Read Glob Grep "Bash(git log:*)" --disallowedTools "Read(//proc/**)"
          > /tmp/lead/claude.json && jq -r '.result // empty' /tmp/lead/claude.json
          > /tmp/lead/plan.json

      # Billed to the owner's Claude subscription, not per token; printed so each run's size shows.
      - name: Claude usage
        if: always()
        run: |
          [ -s /tmp/lead/claude.json ] || exit 0
          jq -r '"Claude Code: \(.num_turns // 0) turns, \((.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0)) input tokens (\(.usage.cache_read_input_tokens // 0) cached), \(.usage.output_tokens // 0) output; $\((.total_cost_usd // 0) * 100 | round / 100) at API prices (subscription)"' /tmp/lead/claude.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lead-plan
          path: /tmp/lead/plan.json
          retention-days: 7

  file:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start a build
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # It holds credentials: never restore a cache agent code saved.

      - uses: actions/download-artifact@v8
        with:
          name: lead-plan
          path: /tmp/lead

      # Schema-checked and capped at three by trusted code; the plan never runs anything.
      - id: propose
        run: uv run --frozen python scripts/beerdev.py propose /tmp/lead/plan.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Start a build
        if: steps.propose.outputs.build == 'true'
        run: gh workflow run beerdev-build.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
