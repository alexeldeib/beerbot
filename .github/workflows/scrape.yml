name: Scrape New Images

on:
  # schedule:
  #   # Run every 4 hours
  #   - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_label:
        description: 'Skip auto-labeling step'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Scrape new images from GroupMe
        env:
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: |
          uv run scripts/scrape_images.py --scrape --incremental

      - name: Auto-label new images with Gemini
        if: ${{ inputs.skip_label != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run scripts/scrape_images.py --label

      - name: Check for changes
        id: check_changes
        run: |
          git add data/images data/labels.json data/metadata.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NEW_IMAGES=$(git diff --staged --name-only data/images/ | wc -l)
            echo "new_images=$NEW_IMAGES" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "feat(data): scrape ${{ steps.check_changes.outputs.new_images }} new images

          Auto-labeled with Gemini (reviewed: false).
          Run 'uv run scripts/review_labels.py' locally to review."
          git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "## Scrape Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**${{ steps.check_changes.outputs.new_images }}** new images committed to main" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All new labels have \`reviewed: false\`. Review them with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "uv run scripts/review_labels.py" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No New Images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No new images found in GroupMe." >> $GITHUB_STEP_SUMMARY
          fi
