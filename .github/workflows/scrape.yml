name: Scrape New Images

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      skip_label:
        description: 'Skip auto-labeling step'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Scrape new images from GroupMe
        env:
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: |
          uv run scripts/scrape_images.py --scrape --incremental

      - name: Auto-label new images with Gemini
        if: ${{ inputs.skip_label != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run scripts/scrape_images.py --label

      - name: Check for changes
        id: check_changes
        run: |
          git add data/images data/labels.json data/metadata.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Count new images
            NEW_IMAGES=$(git diff --staged --name-only data/images/ | wc -l)
            echo "new_images=$NEW_IMAGES" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(data): scrape ${{ steps.check_changes.outputs.new_images }} new images"
          title: "New Images: ${{ steps.check_changes.outputs.new_images }} images scraped"
          body: |
            ## Summary
            Automated scrape found **${{ steps.check_changes.outputs.new_images }}** new images from GroupMe.

            ### What's included
            - New images in `data/images/`
            - Auto-generated labels in `data/labels.json` (reviewed: false)
            - Updated metadata in `data/metadata.json`

            ### Next steps
            1. Review the new images and their auto-labels
            2. Run `uv run scripts/review_labels.py` locally to review labels
            3. Correct any mislabeled images in `data/labels.json`
            4. Set `reviewed: true` for verified labels
            5. Merge this PR

            > Auto-labels are generated by Gemini and may have errors. Please verify before merging.
          branch: scrape/new-images-${{ github.run_number }}
          labels: |
            data
            automated
            needs-review
