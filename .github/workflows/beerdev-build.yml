name: beerdev build

# Builds the oldest open `beerdev` issue; started by beerdev.yml.
# - implement: Claude Code makes the change and every test runs (tests/test_policy.py included),
#   with only read-only credentials.
# - review: for changes beyond routine app code (workflows, scripts, Docker, Fly, dependencies),
#   an independent Claude Code reads the patch as data and approves or rejects it.
# - ship: applies the patch to a fresh checkout without running it, refuses changes to the kernel
#   (this file, the lead, agent prompts and settings, CLAUDE.md files, the policy test) and
#   credential-like text,
#   then merges, deploys through CI, appends CHANGELOG.md, and tells the chat. A change the
#   reviewer did not approve waits as an unmerged PR in the owner's inbox.
# Remove `beerdev-failed` from an issue to retry it. Add required reviewers to the `beerdev`
# environment to approve every ship by hand.

on:
  workflow_dispatch:

permissions: {}

# One build at a time. A newer queued build replaces an older one, and each picks its issue when
# it starts, so nothing is built twice.
concurrency:
  group: beerdev-build
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - id: pick
        run: uv run --frozen python scripts/beerdev.py next
        env:
          GH_TOKEN: ${{ github.token }}

  implement:
    needs: pick
    if: needs.pick.outputs.issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Everything agent-written runs here: a read-only token and no deploy or GroupMe credentials.
    permissions:
      contents: read
      issues: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beerbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d beerbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
      BEERBOT_BOT_ID: test-bot
      DATABASE_URL: postgresql://test:test@localhost/test
      ENVIRONMENT: development
      BEERBOT_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/beerbot_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # It holds credentials: never restore a cache agent code saved.

      - run: uv sync --frozen --extra dev

      - name: Load request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/beerdev
          gh issue view "$ISSUE" --json title,body,labels > /tmp/beerdev/issue.json
          jq -r '"# \(.title)\n\nKind: \(if any(.labels[]; .name == "bug") then "bug" else "feature" end)\n\n\(.body // "" | gsub("<!--[^>]*-->"; ""))"' \
            /tmp/beerdev/issue.json > /tmp/beerdev/request.md

      - name: Implement with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          npx -y @anthropic-ai/claude-code@2.1.319 -p "$(cat .github/beerdev-prompt.md)"
          --add-dir /tmp/beerdev
          --allowedTools Read Edit Write Glob Grep
          "Bash(uv run pytest:*)" "Bash(uv run ruff:*)" "Bash(git diff:*)" "Bash(git status:*)"
          "Bash(uv add:*)" "Bash(uv remove:*)" "Bash(uv lock:*)"
          --disallowedTools "Read(//proc/**)" --output-format json > /tmp/claude-implement.json

      # Billed to the owner's Claude subscription, not per token; printed so each run's size shows.
      - name: Claude usage (implement)
        if: always()
        run: |
          [ -s /tmp/claude-implement.json ] || exit 0
          jq -r '.result // empty' /tmp/claude-implement.json
          jq -r '"Claude Code: \(.num_turns // 0) turns, \((.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0)) input tokens (\(.usage.cache_read_input_tokens // 0) cached), \(.usage.output_tokens // 0) output; $\((.total_cost_usd // 0) * 100 | round / 100) at API prices (subscription)"' /tmp/claude-implement.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test, including the live chat e2e
        env:
          LIVE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -s /tmp/beerdev/skip.md ]; then exit 0; fi
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          BEERBOT_LIVE_LLM=1 GEMINI_API_KEY="$LIVE_GEMINI_API_KEY" uv run pytest -q tests/test_live_chat.py

      - name: Package the change
        run: |
          git add -A
          git diff --cached --binary > /tmp/beerdev/change.patch
          # Artifacts of a public repository are downloadable: never upload a credential.
          if grep -rqE 'sk-ant-|AIza[0-9A-Za-z_-]{30}|gh[pousr]_[A-Za-z0-9]{30}|github_pat_' /tmp/beerdev; then
            echo "::error::The change or its notes contain what looks like a credential"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: beerdev
          path: /tmp/beerdev/
          retention-days: 3

  # Runs nothing the implement agent wrote: the reviewer only reads the patch, the request (fetched
  # from GitHub, not the artifact), and the unchanged repository.
  review:
    needs: [pick, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      reason: ${{ steps.verdict.outputs.reason }}
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: beerdev
          path: /tmp/beerdev

      - name: What does it change?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/review
          [ -s /tmp/beerdev/change.patch ] || exit 0
          echo "patch=true" >> "$GITHUB_OUTPUT"
          cp /tmp/beerdev/change.patch /tmp/review/change.patch
          gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title,body > /tmp/review/request.json
          git apply --index /tmp/beerdev/change.patch
          changed="$(git diff --cached --name-only --no-renames)"
          git reset -q --hard
          routine='^(src/|docs/|README\.md$|tests/test_[^/]*\.py$)'
          if grep -vE "$routine" <<< "$changed" | grep -q .; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review with Claude Code
        if: steps.scope.outputs.infra == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          npx -y @anthropic-ai/claude-code@2.1.319 -p "$(cat .github/beerdev-review-prompt.md)"
          --add-dir /tmp/review --output-format json
          --allowedTools Read Glob Grep --disallowedTools "Read(//proc/**)"
          > /tmp/review/claude.json && jq -r '.result // empty' /tmp/review/claude.json
          > /tmp/review/answer.txt

      # Billed to the owner's Claude subscription, not per token; printed so each run's size shows.
      - name: Claude usage (review)
        if: always()
        run: |
          [ -s /tmp/review/claude.json ] || exit 0
          jq -r '"Claude Code: \(.num_turns // 0) turns, \((.usage.input_tokens // 0) + (.usage.cache_read_input_tokens // 0) + (.usage.cache_creation_input_tokens // 0)) input tokens (\(.usage.cache_read_input_tokens // 0) cached), \(.usage.output_tokens // 0) output; $\((.total_cost_usd // 0) * 100 | round / 100) at API prices (subscription)"' /tmp/review/claude.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.scope.outputs.patch == 'true'
        with:
          enable-cache: false

      # The kernel's policy checks (the base copy) on the patched workflows and scripts, read as
      # data: pinned packages, run from outside the tree with no conftest, plugins, or project
      # config, so nothing the implement agent wrote runs. It must pass before anything is pushed.
      - name: Check the pipeline policy
        if: steps.scope.outputs.patch == 'true'
        run: |
          mkdir -p /tmp/policy
          cp tests/test_policy.py /tmp/policy/
          git apply /tmp/review/change.patch
          cd /tmp/policy
          POLICY_ROOT="$GITHUB_WORKSPACE" PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            uv run --no-config --no-project --with pyyaml==6.0.3 --with pytest==9.0.2 \
            python -I -m pytest -q -p no:cacheprovider --noconftest -c /dev/null \
            --rootdir /tmp/policy -k "not app" test_policy.py

      # The reason lands in a public issue comment: one line, and never anything credential-like.
      - name: Verdict
        id: verdict
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          answer = pathlib.Path("/tmp/review/answer.txt")
          if not answer.exists():
              print("verdict=none")
              raise SystemExit
          match = re.search(r"\{.*\}", answer.read_text(), re.S)
          try:
              found = json.loads(match.group(0)) if match else {}
          except ValueError:
              found = {}
          reason = " ".join(str(found.get("reason") or "No verdict.").split())[:400]
          if re.search(r"sk-ant-|AIza|gh[pousr]_|github_pat_", reason):
              reason = "(withheld: it looked like a credential)"
          print("verdict=" + ("approve" if found.get("approve") is True else "reject"))
          print("reason=" + reason)
          PY

  ship:
    needs: [pick, implement, review]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beerdev
    permissions:
      actions: write # dispatch and watch the CI deploy
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
      GH_TOKEN: ${{ github.token }}
      VERDICT: ${{ needs.review.outputs.verdict }}
      REASON: ${{ needs.review.outputs.reason }}
    steps:
      # A fresh checkout: nothing the agent wrote (code, hooks, git config) ever runs in this job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: beerdev
          path: /tmp/beerdev

      # The artifact is agent-writable, so the issue itself (title, ask id) comes from GitHub.
      - name: Fetch the request
        run: gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title,body,labels,state > /tmp/request.json

      - name: Apply the change
        id: apply
        run: |
          if ! jq -e '.state == "OPEN"' /tmp/request.json > /dev/null; then
            echo "The issue was closed during the build (vetoed or cancelled), so nothing ships."
            exit 0
          fi
          if ! jq -e 'any(.labels[]; .name == "beerdev")' /tmp/request.json > /dev/null; then
            echo "The issue is not queued for beerdev (no beerdev label), so nothing ships."
            exit 0
          fi
          from_chat() { jq -e '.body // "" | test("beerdev:msg=")' /tmp/request.json > /dev/null; }
          if [ -s /tmp/beerdev/skip.md ]; then
            if jq -e 'any(.labels[]; .name == "ops")' /tmp/request.json > /dev/null; then
              # An incident with no code fix still needs someone: hand it to the owner.
              gh issue edit "$ISSUE" --add-label inbox --remove-label beerdev
              gh issue comment "$ISSUE" --body-file /tmp/beerdev/skip.md
              exit 0
            fi
            gh issue close "$ISSUE" --reason "not planned" --comment "$(cat /tmp/beerdev/skip.md)"
            if from_chat; then  # Close the loop with whoever asked; quiet otherwise.
              reason="$(tr '\n' ' ' < /tmp/beerdev/skip.md | cut -c1-240)"
              printf '🤷 Skipping: %s. %s' "$(jq -r .title /tmp/request.json)" "$reason" > /tmp/chat.txt
            fi
            exit 0
          fi
          if [ ! -s /tmp/beerdev/change.patch ]; then
            echo "::error::Claude finished without a change or a reason to skip"
            exit 1
          fi
          git apply --index /tmp/beerdev/change.patch
          # --no-renames lists both sides of a rename, so moving a kernel file is caught too.
          changed="$(git diff --cached --name-only --no-renames)"
          # Every Claude agent loads CLAUDE.md files, in any directory, as instructions.
          kernel='^(\.github/workflows/beerdev-(build|lead)\.yml|\.github/beerdev-[a-z-]+\.md|\.claude/.*|(.*/)?CLAUDE(\.local)?\.md|tests/test_policy\.py)$'
          if grep -E "$kernel" <<< "$changed"; then
            echo "::error::beerdev may not change its own kernel"
            exit 1
          fi
          if grep -qE 'sk-ant-|AIza[0-9A-Za-z_-]{30}|gh[pousr]_[A-Za-z0-9]{30}|github_pat_' /tmp/beerdev/change.patch; then
            echo "::error::The change contains what looks like a credential"
            exit 1
          fi
          routine='^(src/|docs/|README\.md$|tests/test_[^/]*\.py$)'
          if grep -qE '^(pyproject\.toml|uv\.lock)$' <<< "$changed"; then
            # A reviewer can't vet a package's provenance offline, and it runs with every secret.
            echo "hold=true" >> "$GITHUB_OUTPUT"
            echo "why=It changes dependencies, which always wait for the owner." >> "$GITHUB_OUTPUT"
          elif grep -vE "$routine" <<< "$changed" | grep -q . && [ "$VERDICT" != approve ]; then
            echo "hold=true" >> "$GITHUB_OUTPUT"  # Beyond routine code, and not approved.
            echo "why=The independent reviewer did not approve it: ${REASON:-it did not run}" >> "$GITHUB_OUTPUT"
          fi
          echo "ship=true" >> "$GITHUB_OUTPUT"

      - name: Merge, deploy, announce
        if: steps.apply.outputs.ship == 'true'
        env:
          # Can push workflow changes, and its merges start CI. Without it, only changes that
          # leave .github/workflows alone can ship.
          SHIP_TOKEN: ${{ secrets.BEERDEV_SHIP_TOKEN }}
          HOLD: ${{ steps.apply.outputs.hold }}
          WHY: ${{ steps.apply.outputs.why }}
        run: |
          title="$(jq -r .title /tmp/request.json)"
          branch="beerdev/issue-$ISSUE"
          git switch -c "$branch"
          # The history of what shipped lives in the repository, one line per issue.
          [ -f CHANGELOG.md ] || printf '# Changelog\n\nWhat beerdev shipped, oldest first.\n\n' > CHANGELOG.md
          printf -- '- %s: %s (#%s)\n' "$(date -u +%Y-%m-%d)" "$title" "$ISSUE" >> CHANGELOG.md
          git add CHANGELOG.md
          git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "feat: $title" -m "Closes #$ISSUE"
          token="${SHIP_TOKEN:-$GH_TOKEN}"
          git push -q "https://x-access-token:$token@github.com/$GITHUB_REPOSITORY.git" \
            "HEAD:refs/heads/$branch"
          note=/tmp/beerdev/announcement.md
          if [ ! -s "$note" ]; then
            note=/tmp/request.md
            jq -r '.body // "" | gsub("<!--[^>]*-->"; "")' /tmp/request.json > "$note"
          fi
          { cat "$note"; printf '\n\nBuilt by beerdev from a chat request. Closes #%s\n' "$ISSUE"; } > /tmp/beerdev/pr.md
          if [ "$HOLD" = true ]; then
            # Not approved: the owner reviews and merges it by hand, or closes it.
            printf '\n\n**Held for the owner.** %s\n' "$WHY" >> /tmp/beerdev/pr.md
            url="$(GH_TOKEN="$token" gh pr create --head "$branch" --title "feat: $title" \
              --body-file /tmp/beerdev/pr.md)"
            gh issue edit "$ISSUE" --add-label inbox --remove-label beerdev
            gh issue comment "$ISSUE" --body "Held for the owner's review: $url"
            if jq -e '.body // "" | test("beerdev:msg=")' /tmp/request.json > /dev/null; then
              printf '👀 Needs the owner'"'"'s review: %s (%s)' "$title" "$url" > /tmp/chat.txt
            fi
            exit 0
          fi
          GH_TOKEN="$token" gh pr create --head "$branch" --title "feat: $title" --body-file /tmp/beerdev/pr.md
          GH_TOKEN="$token" gh pr merge "$branch" --squash

          # A merge with the ship token starts CI by itself; one with GITHUB_TOKEN never does, so
          # start it explicitly if no run shows up. CI re-runs the full suite before it deploys.
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          run=""
          for attempt in $(seq 36); do
            run="$(gh run list --workflow ci.yml --commit "$sha" \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            [ "$attempt" = 6 ] && gh workflow run ci.yml --ref main
            sleep 5
          done
          gh run watch "$run" --exit-status --interval 30 > /dev/null

          # The agent's how-to note when the group would notice; else a short line for the asker.
          if [ -s /tmp/beerdev/announcement.md ]; then
            cp /tmp/beerdev/announcement.md /tmp/chat.txt
            gh issue comment "$ISSUE" --body-file /tmp/beerdev/announcement.md
          elif jq -e '.body // "" | test("beerdev:msg=")' /tmp/request.json > /dev/null; then
            printf '✅ Shipped: %s.' "$title" > /tmp/chat.txt
          fi

      # Written only by this job, outside the agent-writable artifact, after a decline or a deploy.
      - name: Tell the chat
        env:
          BEERDEV_BOT_ID: ${{ secrets.BEERDEV_BOT_ID }}
        run: |
          [ -s /tmp/chat.txt ] || exit 0
          jq -n --arg bot_id "$BEERDEV_BOT_ID" --rawfile text /tmp/chat.txt \
            '{bot_id: $bot_id, text: ($text | rtrimstr("\n") | .[:1000])}' \
            | curl -fsS -o /dev/null -H "Content-Type: application/json" -d @- \
              https://api.groupme.com/v3/bots/post \
            || echo "::warning::could not post to the chat"

  flag:
    needs: [pick, implement, review, ship]
    if: failure() && needs.pick.outputs.issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ needs.pick.outputs.issue }}
    steps:
      - run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label beerdev-failed
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body \
            "beerdev could not ship this: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
