name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # beerdev merges with GITHUB_TOKEN, which never triggers push workflows; it dispatches instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beerbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d beerbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BEERBOT_BOT_ID: test-bot
      DATABASE_URL: postgresql://test:test@localhost/test
      ENVIRONMENT: development
      BEERBOT_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/beerbot_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Build container
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA}" .

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # Two blue-green deploys (10 minutes each at most) and their checks, when CI rolls back.
    timeout-minutes: 40
    environment: production
    concurrency:
      group: beerbot-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for a newer main revision
        id: release
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${current_sha}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping superseded revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi

      - name: Install flyctl
        if: steps.release.outputs.current == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # What is serving now is the last good release: a failed verification below always
      # restores it, so this never points at a broken deploy.
      - name: Remember the running release
        id: previous
        if: steps.release.outputs.current == 'true'
        run: |
          image="$(flyctl image show --app beerbot-groupme --json \
            | jq -r 'first | "\(.Registry)/\(.Repository):\(.Tag)"')"
          sha="$(curl --silent --max-time 15 https://beerbot-groupme.fly.dev/version | jq -r '.git_sha // empty')"
          if [[ "$image" == registry.fly.io/* ]]; then
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      # The image is labeled with its commit, so rollback.yml can deploy it with its fly.toml.
      - name: Deploy with blue-green replacement
        if: steps.release.outputs.current == 'true'
        run: >-
          flyctl deploy
          --app beerbot-groupme
          --local-only
          --strategy bluegreen
          --build-arg GIT_SHA="${GITHUB_SHA}"
          --image-label "${GITHUB_SHA}"
          --wait-timeout 10m

      - name: Verify production health and revision
        id: verify
        if: steps.release.outputs.current == 'true'
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://beerbot-groupme.fly.dev/health
          curl --fail --silent --show-error --max-time 15 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://beerbot-groupme.fly.dev/ready
          curl --fail --silent --show-error --max-time 15 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://beerbot-groupme.fly.dev/version \
            | jq --exit-status --arg sha "${GITHUB_SHA}" '.git_sha == $sha'
          # After cutover, validate DB connectivity and wake the NEW fleet to
          # recover any receipts committed during the old fleet's shutdown.
          curl --fail --silent --show-error --max-time 15 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://beerbot-groupme.fly.dev/ready/db

      # The deploy went out but production is not healthy on it: put back what was running,
      # including its fly.toml, then fail anyway so ops files the incident and beerdev fixes
      # forward. Migrations are forward-only, so code must keep working on the previous schema.
      - name: Roll back to the release that was running
        if: failure() && steps.verify.outcome == 'failure' && steps.previous.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          echo "::warning::Verification failed; rolling back to ${PREVIOUS_SHA:-the previous release}."
          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --depth 1 origin "$PREVIOUS_SHA"; then
            git show "${PREVIOUS_SHA}:fly.toml" > fly.toml
          fi
          flyctl deploy --app beerbot-groupme --image "$PREVIOUS_IMAGE" \
            --strategy bluegreen --wait-timeout 10m
          curl --fail --silent --show-error --max-time 15 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://beerbot-groupme.fly.dev/ready
          curl --fail --silent --show-error --max-time 15 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://beerbot-groupme.fly.dev/ready/db
