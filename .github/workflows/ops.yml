name: ops

# ops, the SRE (scripts/ops.py). Every 5 minutes it checks, from outside Fly, what users would
# feel: /health and /ready, and whether a message or reply has waited over 5 minutes. Those come
# from memory-only status, so checks never wake the database.
#
# It fixes only what's safe, using a fixed decision table with no model:
# - nudge a stalled worker (wake the queue)
# - roll back a deploy that broke production within the hour (rollback.yml)
# - wait out a failing dependency
#
# Anything else pages the owner in the private "beerbot alerts" GroupMe group, with one incident
# issue assigned to them. Code-level failures become tickets for beerdev (the SWE). It never posts
# in the main chat. The app starts this the moment a message fails. See docs/runbook.md
# (Incidents).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: What prompted this check (the app sends the failure class)
        required: false
  # A failed deploy, or any CI failure on main, is an incident.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# One check at a time, so two runs never open the same incident.
concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  check:
    # Only this repository's own deploy runs: a fork PR can name its branch main, and its log
    # (which it controls) would otherwise reach beerdev's agent as an incident.
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # read CI runs; start a rollback
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # It holds credentials: never restore a cache agent code saved.

      - run: uv run --frozen python scripts/ops.py
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }} # Status and usage reads, and waking the queue
          OPS_ALERT_BOT_ID: ${{ secrets.OPS_ALERT_BOT_ID }} # Posts only to the owner's alerts group
          REASON: ${{ inputs.reason }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
