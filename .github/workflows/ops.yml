name: ops

# ops, the SRE (scripts/ops.py). Every 5 minutes it checks, from outside Fly, what users would
# feel: /health and /ready, and whether a message or reply has waited over 5 minutes. Those come
# from memory-only status, so checks never wake the database.
#
# It fixes only what's safe, using a fixed decision table with no model:
# - wait out a failing dependency
# - roll back a deploy that broke production within the hour (rollback.yml), once
#
# Anything else pages the owner in the private "beerbot alerts" GroupMe group, with one incident
# issue assigned to them. Code-level failures become tickets for beerdev (the SWE), and each new
# one starts a build. It never posts in the main chat. The app starts this the moment a message
# fails. Once a day a separate run sweeps what needs the database (failure classes and spend) and
# expiring credentials, with no probes. See docs/runbook.md (Incidents).

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "23 12 * * *" # The daily sweep (DAILY below)
  workflow_dispatch:
    inputs:
      reason:
        description: What prompted this check (the app sends the failure class)
        required: false
  # A failed deploy, or any CI failure on main, is an incident.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# One check at a time, so two runs never open the same incident. A newer pending run replaces an
# older pending one, so the daily sweep has a group of its own, and each check also catches a CI
# failure whose own check was replaced (scripts/ops.py).
concurrency:
  group: ${{ github.event.schedule == '23 12 * * *' && 'ops-daily' || 'ops' }}
  cancel-in-progress: false

jobs:
  check:
    # Only this repository's own deploy runs: a fork PR can name its branch main, and its log
    # (which it controls) would otherwise reach beerdev's agent as an incident.
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # read CI runs; start a rollback or a beerdev build
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # It holds credentials: never restore a cache agent code saved.

      - run: uv run --frozen python scripts/ops.py
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }} # Status and usage reads only
          OPS_ALERT_BOT_ID: ${{ secrets.OPS_ALERT_BOT_ID }} # Posts only to the owner's alerts group
          REASON: ${{ inputs.reason }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          DAILY: ${{ github.event.schedule == '23 12 * * *' }}
