# fly.toml app configuration file generated for beerbot-groupme on 2025-12-27T13:42:21-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'beerbot-groupme'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'bluegreen'

[env]
  ENVIRONMENT = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

# Routing only asks "is the process serving?". Accepting a webhook is one INSERT into the durable
# inbox, so a processing failure must never take the app out of rotation: on 2026-11-25 a /ready
# routing check dropped every webhook while the workers were failing.
[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '5s'

  [http_service.checks.headers]
    X-Forwarded-Proto = 'https'

# Deploy gate and monitoring, never routing: workers are running and their last scan succeeded.
# Memory-only. Never use /ready/db for periodic probes.
[checks.ready]
  type = 'http'
  port = 8080
  method = 'GET'
  path = '/ready'
  interval = '30s'
  timeout = '5s'
  grace_period = '15s'

  [checks.ready.headers]
    X-Forwarded-Proto = 'https'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
